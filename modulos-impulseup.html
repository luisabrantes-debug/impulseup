<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulos Impulseup</title>
    
    <!-- Carrega Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carrega as fontes Poppins e Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca para exportação de HTML para imagem -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // Configuração personalizada do Tailwind para cores e fontes da Impulseup
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'impulse-highlight': '#cc0088',
                        'impulse-text': '#4e506b',
                        'impulse-bg-light': '#f7f7f9', // Fundo claro geral
                        'impulse-card-border': '#e0e0e0', // Borda sutil
                        'impulse-light-shadow': 'rgba(204, 0, 136, 0.15)', // Sombra para módulo incluso
                        'impulse-light-bg': '#fbe7f3', // Fundo claro para status 'Incluso'
                        'impulse-included-bg': '#fdf7fc', // NOVO: Fundo muito levemente rosa para destaque do card
                    },
                    fontFamily: {
                        title: ['Poppins', 'sans-serif'],
                        body: ['Roboto', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Estilos globais para garantir o uso das fontes e um visual limpo */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff; /* Fundo branco para contrastar com as cards */
        }
        .card-title {
            font-family: 'Poppins', sans-serif;
            color: #cc0088;
            word-break: break-word;
        }
        /* Estilo para o toggle customizado */
        .toggle-container {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
            flex-shrink: 0;
            vertical-align: middle;
        }
        .toggle-checkbox {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        .toggle-checkbox:checked + .toggle-slider {
            background-color: #cc0088;
        }
        .toggle-checkbox:checked + .toggle-slider:before {
            transform: translateX(22px);
        }
        
        /* Classe para esconder elementos durante a captura da imagem */
        .hide-on-capture {
            display: none !important;
        }

        /* Classe chave para fixar a altura da área do título e garantir o alinhamento da descrição */
        .card-header-area {
            min-height: 90px; /* Aumentado para garantir alinhamento vertical */
            margin-bottom: 1rem; /* Adiciona espaço sob o cabeçalho */
        }

        /* Fixa a altura do título para evitar desalinhamento */
        .card-title-fixed {
            height: 28px; /* Altura de uma linha de texto xl */
            overflow: hidden;
            display: block;
        }

        /* Estilo para a fita de destaque flutuante */
        .highlight-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px; /* Altura da antiga border-t-8 */
            background-color: #cc0088;
            border-top-left-radius: 0.75rem; /* rounded-xl */
            border-top-right-radius: 0.75rem; /* rounded-xl */
            z-index: 10;
        }
    </style>
</head>
<body class="p-4 md:p-10 bg-white">

    <div class="max-w-7xl mx-auto" id="main-content">
        
        <!-- Botão de exportação -->
        <div class="flex justify-end mb-4 hide-on-capture">
             <button onclick="exportToJPG()" 
                    class="flex items-center px-4 py-2 bg-impulse-highlight text-white font-body font-medium rounded-lg shadow-lg hover:opacity-90 transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Exportar JPG
            </button>
        </div>

        <h1 class="text-3xl md:text-4xl font-title text-impulse-text mb-8 md:mb-12 text-center">
            Módulos Inclusos
        </h1>
        
        <!-- Contêiner dos Módulos Opcionais (1x5 em telas grandes) -->
        <div id="modules-container" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5">
            <!-- Cards serão injetados aqui -->
        </div>

        <!-- Seção de Módulos Sempre Inclusos (2ª Linha) -->
        <div class="mt-16">
            <h2 class="text-2xl md:text-3xl font-title text-impulse-highlight mb-2">
                Módulos inclusos
            </h2>
            <p class="font-body text-impulse-text mb-6">
                Todos os módulos abaixo inclusos gratuitamente.
            </p>

            <div id="always-included-container" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                <!-- Cards sempre inclusos serão injetados aqui -->
            </div>
        </div>

        <p id="usage-hint" class="mt-12 text-center text-sm font-body text-gray-500 hide-on-capture">
            * Clique no círculo no canto superior direito de cada card para incluir ou remover o módulo.
        </p>
    </div>

    <script>
        const HIGHLIGHT_COLOR = 'impulse-highlight';
        const TEXT_COLOR = 'impulse-text';
        const LIGHT_SHADOW_COLOR = 'impulse-light-shadow';
        const LIGHT_BG_COLOR = 'impulse-light-bg';
        
        // Dados dos Módulos Opcionais
        const modulesData = [
            {
                id: 'avaliacoes',
                title: 'Avaliações',
                description: 'Avalie sem vieses com um processo sob medida.',
                features: [
                    'Avaliações de experiência',
                    'Avaliações flexíveis 90°, 180°, 360°',
                    'Relatório individual personalizável',
                    'Ninebox integrado com metas',
                    'IA integra para insights poderosos',
                    'Feedback contínuo',
                    'Analytics com comparativo entre avaliações',
                    'Mapeamento de talentos e sucessores'
                ]
            },
            {
                id: 'pesquisas', 
                title: 'Pesquisas',
                description: 'Mensure o engajamento e satisfação do seu time.',
                features: [
                    'Pesquisa de clima com modelo ou personalizada',
                    'eNPS, pesquisa pulsada ou customizada',
                    'Pesquisas confidenciais, anônimas ou identificáveis',
                    'Analytics com mapa de calor',
                    'Comparativo evolutivo de pesquisas',
                    'Analytics especial para lideranças'
                ]
            },
            {
                id: 'metas',
                title: 'Metas',
                description: 'Alinhe as metas individuais com os objetivos da empresa.',
                features: [
                    'Ciclos simultâneos de metas ou OKRs',
                    'Metas com pesos, intervalos e quebras por tempo',
                    'Cascateamento de metas do estratégico ao operacional',
                    'Acompanhamento com farol de atingimento e análise de desvio',
                    'Cálculo de resultados individuais integrados a AD',
                    'Gestão de metas simplificado com árvore de metas'
                ]
            },
            {
                id: 'learning',
                title: 'Learning',
                description: 'Desenvolva cada colaborador no que mais precisam.',
                features: [
                    'Conteúdos diversificados, como vídeos, textos e PDFs',
                    'Experiência agradável para engajamento dos usuários',
                    'Dashboard de acompanhamento para líderes e administradores',
                    'Gestão de turmas com controle de conclusão'
                ]
            },
            {
                id: 'remuneracao',
                title: 'Rem. Variável', 
                description: 'Engaje os colaboradores com os resultados que alcançam.',
                features: [
                    'Cálculos automáticos e precisos',
                    'Integração com Metas e Avaliações',
                    'Personalização de regras de participação',
                    'Personalização da fórmula para cálculo',
                    'Transparência e engajamento de líderes e colaboradores',
                    'Gestão de metas simplificado com árvore de metas'
                ]
            }
        ];
        
        // Dados dos Módulos Sempre Inclusos
        const alwaysIncludedModules = [
            { id: 'feedbacks', title: 'Feedbacks', description: 'Crie uma cultura de feedbacks para alcançar o desenvolvimento contínuo' },
            { id: 'pdi', title: 'PDI', description: 'Planeje, personalize e acompanhe o desenvolvimento das suas pessoas.' },
            { id: 'reunioes', title: 'Reuniões', description: 'Aproxime gestores e colaboradores em um espaço de alinhamento e planejamento.' },
            { id: 'acoes_iniciativas', title: 'Ações e iniciativas', description: 'Gerencie entregas, alinhe prazos e defina prioridades para alcançar os objetivos' },
            { id: 'competencias', title: 'Competências', description: 'Mapeie todas as habilidades que as suas equipes precisam para alcançar os seus objetivos' },
            { id: 'minha_equipe', title: 'Perfil 360º', description: 'Tenha lideranças mais maduras, com uma visão completa dos seus times.' },
            { id: 'mural_reconhecimento', title: 'Mural de reconhecimento', description: 'Deixe as conquistas públicas para que cada pessoa possa ser reconhecida pelos seus feitos' },
            { id: 'dashboard_administrador', title: 'Dashboard do administrador', description: 'Tenha uma visão completa sobre o andamento das suas iniciativas em uma só tela.' },
            { id: 'iap', title: 'iap', description: 'Traga mais inteligência para os processos, ganhando tempo, credibilidade e poder analítico' }
        ];

        // Estado inicial dos módulos (lê do localStorage ou define todos como false)
        let moduleState = {};

        function loadState() {
            try {
                const storedState = localStorage.getItem('impulseupModuleState');
                moduleState = storedState ? JSON.parse(storedState) : {};
            } catch (error) {
                console.error("Erro ao carregar estado do localStorage:", error);
                moduleState = {};
            }
            
            // Garante que todos os módulos tenham um estado inicial, se não estiverem no storage
            modulesData.forEach(mod => {
                if (typeof moduleState[mod.id] === 'undefined') {
                    moduleState[mod.id] = false;
                }
            });

            // Seleção padrão solicitada: AD, Metas e Rem. Variável inclusos
            moduleState['avaliacoes'] = true;
            moduleState['metas'] = true;
            moduleState['remuneracao'] = true;
        }

        function saveState() {
            try {
                localStorage.setItem('impulseupModuleState', JSON.stringify(moduleState));
            } catch (error) {
                console.error("Erro ao salvar estado no localStorage:", error);
            }
        }

        /**
         * Gera o HTML de um ícone de verificação (checkmark SVG).
         * @param {string} colorClass - Classe Tailwind para a cor do SVG.
         * @returns {string} HTML do SVG.
         */
        function getCheckIcon(colorClass) {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${colorClass} flex-shrink-0">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            `;
        }

        /**
         * Renderiza um único card do módulo opcional.
         * @param {Object} module - O objeto de dados do módulo.
         * @param {boolean} isIncluded - Se o módulo está atualmente incluído.
         * @returns {string} O HTML completo do card.
         */
        function renderModuleCard(module, isIncluded) {
            // Classes condicionais para o estado "Incluso"
            const baseClasses = `border border-gray-200`; // Borda base para todos
            
            const cardClasses = isIncluded
                ? `shadow-xl shadow-[${LIGHT_SHADOW_COLOR}] bg-impulse-included-bg` // Inclusos (Sombra e fundo rosa, sem borda top)
                : `${baseClasses} bg-white`; // Não Inclusos (Borda fina em volta, fundo branco)
            
            const titleColor = isIncluded ? 'text-impulse-highlight' : `text-[${TEXT_COLOR}]`;
            const descriptionColor = `text-[${TEXT_COLOR}]`;

            const statusText = isIncluded ? 'Incluso' : 'Não Incluso';
            const statusBgColor = isIncluded ? 'bg-impulse-light-bg' : 'bg-gray-100';
            const statusTextColor = isIncluded ? 'text-impulse-highlight font-bold' : 'text-gray-500';
            
            // Cor do ícone de checkmark nas features
            const checkColor = isIncluded ? `text-impulse-highlight` : 'text-gray-400';

            // Conteúdo das Features
            const featuresHTML = module.features.map(feature => `
                <li class="flex items-start mb-3 font-body text-sm ${isIncluded ? descriptionColor : 'text-gray-500'}">
                    ${getCheckIcon(checkColor)}
                    <span class="ml-2 leading-tight">${feature}</span>
                </li>
            `).join('');

            // Fita de destaque (Ribbon)
            const ribbonHTML = isIncluded ? `<div class="highlight-ribbon rounded-t-xl"></div>` : '';
            
            return `
                <div id="card-${module.id}" class="module-card p-6 rounded-xl transition-all duration-300 ${cardClasses} relative">
                    
                    ${ribbonHTML} <!-- Fita de destaque -->

                    <div class="card-header-area">
                        <h2 class="card-title text-xl font-title font-bold ${titleColor} mb-2 card-title-fixed">
                            ${module.title}
                        </h2>
                        
                        <div class="flex items-center gap-3 mb-4"> 
                            <div class="toggle-container">
                                <input type="checkbox" id="toggle-${module.id}" 
                                    class="toggle-checkbox" 
                                    data-module-id="${module.id}"
                                    ${isIncluded ? 'checked' : ''}
                                    onclick="toggleModule('${module.id}')" />
                                <label for="toggle-${module.id}" class="toggle-slider"></label>
                            </div>
                            <span class="inline-block px-2 py-1 rounded-full text-xs font-body ${statusBgColor} ${statusTextColor} flex-shrink-0 whitespace-nowrap">
                                ${statusText}
                            </span>
                        </div>
                    </div>

                    <p class="font-body ${descriptionColor} mb-6 text-sm">
                        ${module.description}
                    </p>

                    <ul class="space-y-2">
                        ${featuresHTML}
                    </ul>

                </div>
            `;
        }
        
        /**
         * Renderiza um único card do módulo sempre incluso.
         * @param {Object} module - O objeto de dados do módulo sempre incluso.
         * @returns {string} O HTML completo do card.
         */
        function renderAlwaysIncludedCard(module) {
            // Classes para Módulos Sempre Inclusos (borda fina, fundo branco)
            const cardClasses = `border border-gray-200 shadow-md bg-white`;
            const titleColor = 'text-impulse-highlight';
            const descriptionColor = `text-[${TEXT_COLOR}]`;

            return `
                <div id="card-${module.id}" class="module-card p-6 rounded-xl transition-all duration-300 ${cardClasses} relative">
                    
                    <div> 
                        <h3 class="font-title font-bold text-lg ${titleColor} mb-1">
                            ${module.title}
                        </h3>
                        <p class="font-body text-sm ${descriptionColor}">
                            ${module.description}
                        </p>
                    </div>
                </div>
            `;
        }

        /**
         * Alterna o estado de inclusão de um módulo.
         * @param {string} moduleId - O ID do módulo a ser alternado.
         */
        window.toggleModule = function(moduleId) {
            moduleState[moduleId] = !moduleState[moduleId];
            saveState();
            // Re-renderiza para aplicar as classes condicionais
            renderAllModules();
        }

        /**
         * Renderiza todos os cards na tela.
         */
        function renderAllModules() {
            const optionalContainer = document.getElementById('modules-container');
            optionalContainer.innerHTML = ''; // Limpa o conteúdo
            
            modulesData.forEach(module => {
                const isIncluded = moduleState[module.id];
                const cardHTML = renderModuleCard(module, isIncluded);
                optionalContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
            
            // Renderiza os Módulos Sempre Inclusos
            const includedContainer = document.getElementById('always-included-container');
            includedContainer.innerHTML = '';
            
            alwaysIncludedModules.forEach(module => {
                const cardHTML = renderAlwaysIncludedCard(module);
                includedContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        /**
         * Exporta a visualização principal (título e cards) para um arquivo JPG.
         */
        window.exportToJPG = async function() {
            const container = document.getElementById('main-content');
            
            // Oculta elementos que não devem aparecer na imagem (botão de exportar e dica de uso)
            const elementsToHide = document.querySelectorAll('.hide-on-capture');
            elementsToHide.forEach(el => el.classList.add('hidden'));

            try {
                // Captura o conteúdo do container
                const canvas = await html2canvas(container, {
                    scale: 2, // Aumenta a escala para alta resolução (melhor qualidade)
                    useCORS: true,
                    backgroundColor: '#ffffff' // Fundo branco
                });

                // Converte o canvas para DataURL em formato JPEG com qualidade de 90%
                const imageURL = canvas.toDataURL('image/jpeg', 0.9);

                // Cria um link temporário para download
                const link = document.createElement('a');
                link.href = imageURL;
                link.download = 'modulos_impulseup.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("Erro ao exportar para JPG:", error);
            } finally {
                // Torna os elementos visíveis novamente
                elementsToHide.forEach(el => el.classList.remove('hidden'));
            }
        }

        // 1. Carrega o estado salvo no localStorage.
        loadState();
        
        // 2. Renderiza a interface com o estado inicial.
        renderAllModules();
    </script>
</body>
</html>
